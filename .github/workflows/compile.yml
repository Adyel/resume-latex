name: Compile & Release Resumes

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Tectonic
        run: |
          gh release download --repo tectonic-typesetting/tectonic --pattern "*x86_64-unknown-linux-musl.tar.gz" --output tectonic.tar.gz
          tar -xzf tectonic.tar.gz
          sudo mv tectonic /usr/local/bin/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Tectonic Packages & Fonts
        uses: actions/cache@v4
        with:
          path: ~/.cache/Tectonic
          key: ${{ runner.os }}-tectonic-${{ hashFiles('**/*.tex') }}
          restore-keys: |
            ${{ runner.os }}-tectonic-

      - name: Compile Resumes
        run: |
          tectonic adyel-professional-resume.tex
          tectonic adyel-academic-resume.tex

      - name: Upload PDF Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-resumes
          path: |
            adyel-professional-resume.pdf
            adyel-academic-resume.pdf

      - name: Create or Update "latest" Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: Latest Compiled Resumes
          body: |
            Automated build of Adyel's Professional Resume and Academic CV.
            
            - [Download Professional Resume](https://github.com/${{ github.repository }}/releases/latest/download/adyel-professional-resume.pdf)
            - [Download Academic CV](https://github.com/${{ github.repository }}/releases/latest/download/adyel-academic-resume.pdf)
          draft: false
          prerelease: false
          files: |
            adyel-professional-resume.pdf
            adyel-academic-resume.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
